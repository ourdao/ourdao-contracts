name: Integration Test

# DISABLED (#444): this job calls four scripts that do not exist yet —
# start-local-network.sh, run-test-actions.sh, start-backend-indexer.sh and
# assert-db-rows.sh — so on push/PR it failed at "Set up local network" every
# time and reported a permanently red, misleading check.
#
# It now runs only when triggered by hand. Put the `push` / `pull_request`
# triggers back in the same PR that adds those scripts to scripts/. That work
# is the README roadmap item "Deeper integration testing against
# ourdao-backend's indexer":
# https://github.com/ourdao/ourdao-contracts#roadmap
#
# contracts/dao/src/tests/repo_hygiene.rs fails if push/PR triggers come back
# while any script this workflow calls is still missing.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # soroban-sdk requires the wasm32v1-none target (Rust 1.84+).
  WASM_TARGET: wasm32v1-none

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Installs the channel, components and wasm target pinned in
      # rust-toolchain.toml (#240), so CI, local and Docker builds share one rustc.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc -V

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check (all targets)
        run: cargo check --locked --all-targets

      - name: Build wasm (release)
        run: cargo build --locked --target ${{ env.WASM_TARGET }} --release

      - name: Set up local network
        run: |
          ./scripts/start-local-network.sh

      - name: Deploy contract
        run: stellar contract deploy --wasm target/wasm32v1-none/release/ourdao_dao.optimized.wasm --source funder --network test

      - name: Run actions to trigger events
        run: |
          ./scripts/run-test-actions.sh

      - name: Start backend indexer
        run: |
          ./scripts/start-backend-indexer.sh

      - name: Wait for indexer to process
        run: sleep 30

      - name: Assert DB rows
        run: |
          ./scripts/assert-db-rows.sh