name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  WASM_TARGET: wasm32v1-none

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Installs the channel, components and wasm target pinned in
      # rust-toolchain.toml (#240), so CI, local and Docker builds share one rustc.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc -V

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build optimized wasm
        run: cargo build --locked --target ${{ env.WASM_TARGET }} --release

      - name: Compute checksums
        id: checksums
        run: |
          WASM_FILE="target/${WASM_TARGET}/release/ourdao_dao.optimized.wasm"
          SHA256=$(sha256sum "${WASM_FILE}" | awk '{print $1}')
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT
          echo "wasm_file=${WASM_FILE}" >> $GITHUB_OUTPUT
          echo "Wasm SHA-256: ${SHA256}"

      - name: Create Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v0.1.15
        with:
          files: ${{ steps.checksums.outputs.wasm_file }}
          body: |
            ## OurDAO Contract Release ${{ github.ref_name }}

            ### Verification

            To verify this release matches the source code:

            ```bash
            # Download the wasm from this release
            # Compute its SHA-256 hash
            sha256sum ourdao_dao.optimized.wasm

            # Compare against the checksum below
            ```

            **SHA-256 Checksum:**
            ```
            ${{ steps.checksums.outputs.sha256 }}
            ```

            ### Build Info

            - **Source commit:** ${{ github.sha }}
            - **Tag:** ${{ github.ref_name }}
            - **Built with:** Rust pinned in rust-toolchain.toml, target ${{ env.WASM_TARGET }}
            - **Build command:** `cargo build --locked --target ${{ env.WASM_TARGET }} --release`

            ### Deployment

            To deploy this release on a network, see [DEPLOYMENTS.md](./DEPLOYMENTS.md).
